apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RITHxDTT/inventory-gitOps.git
    targetRevision: master
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: inventory

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true